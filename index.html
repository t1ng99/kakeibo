async function loadMembers(){S.members=(await getDocs(collection(db,"members"))).docs.map(d=>({email:d.id,role:d.data().role}));}
async function openLedger(){
  if(unsub)unsub();
  S.years={};(await getDocs(P("years"))).forEach(d=>S.years[d.id]=d.data().m);
  const f=await getDoc(D("meta","settings")),fd=f.exists()?f.data():{};S.weekly=fd.weekly||0;S.since=fd.since||"";S.cats=fd.cats?.length?fd.cats:[...DEF];S.icats=fd.icats?.length?fd.icats:[...IDEF];S.pays=fd.pays?.length?fd.pays:[...PDEF];S.accts=fd.accts?.length?fd.accts:[...ADEF];S.link={...(fd.link||{}),[SA]:SP};await setDoc(D("people",S.user.email),{email:S.user.email,seen:Date.now()},{merge:true});
  const sb=(q,k)=>onSnapshot(P(q),s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));draw();});const u=[sb("expenses","exp"),sb("incomes","inc"),sb("events","ev"),sb("todos","todos"),sb("shifts","shifts"),sb("work","wkl"),sb("savings","sav"),sb("points","pts"),sb("wishes","wish"),sb("people","people"),sb("photos","photos"),sb("notes","notes")];unsub=()=>u.forEach(f=>f());

const g=(y,i,k)=>+(S.years[y]?.[i]?.[k])||0;

const ym=(y,i)=>y+"-"+pad(i+1);

const aCum=(a,y)=>sumA(S.sav.filter(e=>e.acct===a&&yr(e)<=y))-(cardOf(a)?sumA(S.exp.filter(e=>PL(e.pay)===cardOf(a)&&yr(e)<=y)):0);
const GOAL=10,KL={good:"好寶寶",bad:"壞寶寶"},WS={open:"未申請",requested:"申請中",approved:"已同意",declined:"已婉拒",done:"已達成"};

/* ===== 澳洲稅務估算(2026-27) ===== */
const BR={res:[[18200,0],[45000,.15],[135000,.30],[190000,.37],[1e12,.45]],whm:[[45000,.15],[135000,.30],[190000,.37],[1e12,.45]],for:[[135000,.30],[190000,.37],[1e12,.45]]};

const taxOn=(gr,w)=>{const md=w.mode||"res";if(md==="flat")return gr*(+w.flat||0)/100;let t=0,p=0;for(const [u,r] of BR[md]){if(gr>p)t+=(Math.min(gr,u)-p)*r;p=u}
  if(md==="res"){const li=gr<=37500?700:gr<=45000?700-(gr-37500)*.05:gr<=66667?325-(gr-45000)*.015:0;t=Math.max(0,t-li);if(w.medicare!==false)t+=gr*.02}return t};

function calcW(p,f,W){const w=W[p]||{},rows=S.shifts.filter(s=>s.by===p&&dk(s.date)&&fyOf(dk(s.date))===f).sort((a,b)=>dk(a.date)>dk(b.date)?1:dk(a.date)<dk(b.date)?-1:(a.at||0)-(b.at||0));

  return {rows,mo,cum,hh,tax:taxOn(cum,w)}}

function vUs(){
  const me=S.user.email,ppl=pplAll(),T=new Date(),today=new Date(T.getFullYear(),T.getMonth(),T.getDate());

      hero=`<div class="hd">我們在一起<b>${days}</b>天</div><div class="m">${yy} 年 ${mm} 個月 ${dd} 天・從 ${esc(S.since)} 開始</div><div class="m">${l1?`再 ${l1} 天就是第 ${nx} 天`:`今天是第 ${nx} 天紀念日!`}・${l2?`距離下次週年還有 ${l2} 天`:"今天是週年紀念日!"}</div>`}
    else hero=`<div class="hd">還沒開始呢</div>`}
  const ph=S.photos.slice().sort((a,b)=>(b.at||0)-(a.at||0)),nt=S.notes.slice().sort((a,b)=>(b.at||0)-(a.at||0)),zp=S.photos.find(x=>x.id===S.zoom);

  <h1 style="margin-top:24px">🌟 願望清單</h1><div class="row" style="margin-bottom:14px">${ppl.map(e=>`<button class="pill ${e===v?"on":""}" data-a="pp" data-v="${esc(e)}">${AV(e)} ${nm(e)}</button>`).join("")}</div>
  ${mine?`<div class="quick"><div class="row"><b style="color:var(--gold)">新增願望</b><select id="wty"><option value="good">♥ 好願望(用 ${GOAL} 點好寶寶兌換)</option><option value="bad">★ 壞願望(用 ${GOAL} 點壞寶寶兌換)</option><option value="wish">🌟 願望(需對方同意)</option></select><input id="wt" placeholder="想要什麼?" style="flex:1;min-width:160px"><button class="btn" data-a="addwish">新增</button></div></div>`:""}
  <div class="card">${ws.map(wrow).join("")||'<p class="m">這份清單還是空的</p>'}</div></div>`;
}
function vCal(){
  const y=S.cy,m=S.cm,pre=ym(y,m),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),t0=tk();
  const by=arr=>{const o={};arr.forEach(e=>{const k=dk(e.date);if(k&&k.startsWith(pre))(o[k]??=[]).push(e)});return o};
  const E=by(S.ev),I=by(S.inc),X=by(S.exp),sm=a=>sumA(a||[]),all=o=>Object.values(o).flat();
  const ti=sm(all(I)),tx=sm(all(X)),c=[];
  for(let i=0;i<first;i++)c.push("<div></div>");
  for(let d=1;d<=days;d++){const k=pre+"-"+pad(d),ev=E[k]||[],ni=sm(I[k]),ex=sm(X[k]);
    c.push(`<div class="day ${S.sel===k?"sel":""} ${k===t0?"td":""}" data-a="pick" data-v="${k}"><b>${d}</b>${ev.slice(0,2).map(e=>`<div class="ev">${esc(e.title)}</div>`).join("")}${ev.length>2?`<div class="m">+${ev.length-2}</div>`:""}${ni?`<div class="gi">+${n(ni)}</div>`:""}${ex?`<div class="rx">-${n(ex)}</div>`:""}</div>`)}
  const k=S.sel,L=(arr,f)=>(arr||[]).map(f).join("")||'<p class="m">沒有</p>';
  const det=k?`<div class="card" style="margin-top:14px"><h3>${k}</h3>
  <b>行程</b>${L(E[k],e=>`<div class="item"><span class="n">${esc(e.title)}</span><button class="x" data-a="delc" data-c="events" data-id="${e.id}">✕</button></div>`)}
  <div class="row" style="margin:8px 0 16px"><input id="et" placeholder="新增行程" style="flex:1"><button class="btn sm" data-a="adde">新增</button></div>
  <b>收入</b> <span class="m">(請到收支表記錄)</span>${L(I[k],e=>`<div class="item"><span class="n">${esc(e.item)}</span><span class="a">+${n(e.amount)}</span></div>`)}
  <b>支出</b>${L(X[k],e=>`<div class="item"><span class="m">${esc(e.cat)}</span><span class="n">${esc(e.item)}</span><span class="a">-${n(e.amount)}</span></div>`)}</div>`:'<p class="m">點日期可以新增行程,也能看當天的收入與支出。</p>';
  return `<h1>月曆</h1><div class="row" style="margin-bottom:14px"><button class="pill" data-a="cm" data-v="-1">‹</button><b>${y} 年 ${m+1} 月</b><button class="pill" data-a="cm" data-v="1">›</button></div>
  <div class="cards"><div class="card k k4"><small>本月收入</small><b>${n(ti)}</b></div><div class="card k k3"><small>本月支出</small><b>${n(tx)}</b></div><div class="card k k2"><small>差額</small><b>${n(ti-tx)}</b></div></div>
  <div class="card"><div class="cal">${"日一二三四五六".split("").map(w=>`<div class="wd">${w}</div>`).join("")}${c.join("")}</div></div>${det}`;
}
function todoCard(){
  const o=S.todos.slice().sort((a,b)=>(a.due||"9")>(b.due||"9")?1:-1),open=o.filter(t=>!t.done),done=o.filter(t=>t.done).sort((a,b)=>(b.at||0)-(a.at||0)),t0=tk();
  const row=t=>`<div class="item"><input type="checkbox" data-a="tog" data-id="${t.id}" ${t.done?"checked":""}><span class="n" style="${t.done?"text-decoration:line-through;color:var(--mut)":""}">${esc(t.text)}</span>${t.due?`<span class="m" style="${!t.done&&t.due<t0?"color:#ee5f8c":""}">${esc(t.due)}</span>`:""}<span class="m">${nm(t.by)}</span><button class="x" data-a="delc" data-c="todos" data-id="${t.id}">✕</button></div>`;
  return `<h3>待辦事項 <span class="m">${open.length} 件未完成</span></h3><div class="row"><input id="tt" placeholder="要做什麼?" style="flex:1;min-width:140px"><input id="tdd" type="date"><button class="btn" data-a="addt">新增</button></div>
  ${open.map(row).join("")||'<p class="m">全部完成了</p>'}<h3 style="margin-top:14px">已完成 <span class="m">${done.length}</span></h3>${done.map(row).join("")||'<p class="m">還沒有</p>'}`;
}
function vSe(){
  const cc=(t,key,id)=>`<div class="card" style="margin-bottom:14px"><h3>${t}</h3><div class="row">${S[key].map(c=>`<span class="pill">${esc(c)} ${[SP,SA].includes(c)?"":`<button class="x" data-a="rmc" data-k="${key}" data-v="${esc(c)}">✕</button>`}</span>`).join("")}</div><div class="row" style="margin-top:10px"><input id="${id}" placeholder="新分類名稱"><button class="btn sm" data-a="addc" data-k="${key}" data-i="${id}">新增</button></div></div>`;
  return `<h1>設定</h1><div class="card" style="margin-bottom:14px"><h3>每週固定支出(兩人共用)</h3><div class="row"><input id="fx" inputmode="numeric" value="${S.weekly}"><button class="btn g sm" data-a="fixed">儲存</button></div><p class="m">房租、水電等固定開銷。每月金額會依該月天數換算(每週金額 × 天數 ÷ 7),不用再記到收支表。</p></div>
  ${cc("支出分類","cats","nc1")}${cc("收入分類","icats","nc2")}${cc("付款方式","pays","nc3")}${cc("存款帳戶","accts","nc4")}<div class="card" style="margin-bottom:14px"><h3>帳戶與扣款卡</h3>${S.accts.map(a=>`<div class="item"><span class="n">${esc(a)}</span><span class="m">扣款卡</span><select data-a="lnk" data-id="${esc(a)}" ${a===SA?"disabled":""}><option value="">(無)</option>${S.pays.map(c=>`<option ${S.link[a]===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`).join("")}<p class="m">每個帳戶可以對應一種付款方式(扣款卡),該卡的支出會算在這個帳戶,總覽就能顯示每個帳戶的結餘。例如新增帳戶「Jia 銀行帳戶」和付款方式「Jia 銀行卡」,再在這裡對應起來。「共同帳戶」固定對應「共同帳戶卡」,兩者都不能移除。</p></div>
  <div class="card"><h3>使用權限</h3><p class="m">管理者:可管理成員與設定。成員:和管理者一起查看、記錄同一本共同帳本。</p>${S.members.map(m=>`<div class="item"><span class="n">${nm(m.email)} <span class="m">${esc(m.email)}</span></span><select data-a="role" data-id="${esc(m.email)}"><option value="admin" ${m.role==="admin"?"selected":""}>管理者</option><option value="member" ${m.role==="member"?"selected":""}>成員</option></select>${m.email!==S.user.email?`<button class="x" data-a="rm" data-id="${esc(m.email)}">✕</button>`:""}</div>`).join("")}
  <div class="row" style="margin-top:10px"><input id="me" type="email" placeholder="對方的 Gmail" style="flex:1"><select id="mr"><option value="member">成員</option><option value="admin">管理者</option></select><button class="btn sm" data-a="addm">新增</button></div></div>`;
}
const saveSet=()=>setDoc(D("meta","settings"),{weekly:S.weekly,cats:S.cats,icats:S.icats,pays:S.pays,accts:S.accts,link:S.link,since:S.since},{merge:true});
const shrink=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)});
const act_={
  since:async()=>{S.since=$("#sinceIn").value;await saveSet();draw()},
  zoom:v=>{S.zoom=v;draw()},zoomx:()=>{S.zoom=null;draw()},
  cap:async(_,e)=>{const c=prompt("照片說明");if(c!==null)await updateDoc(D("photos",e.dataset.id),{cap:c.trim()})},
  addn:async()=>{const t=$("#nt").value.trim();if(t)await addDoc(P("notes"),{text:t,by:S.user.email,at:Date.now()})},
  prof:()=>{S.pf=!S.pf;draw()},
  pfsave:async()=>{await setDoc(D("people",S.user.email),{email:S.user.email,name:$("#pfn").value.trim(),avatar:$("#pfa").value,seen:Date.now()},{merge:true});S.pf=false;draw()},
  ac:v=>{S.ac=v;draw()},pp:v=>{S.pp=v;draw()},
  give:async v=>{const to=$("#pg")?.value;if(!to)return;await addDoc(P("points"),{to,kind:v,delta:1,note:$("#pn").value.trim(),by:S.user.email,at:Date.now()})},
  addwish:async()=>{const t=$("#wt").value.trim();if(t)await addDoc(P("wishes"),{owner:S.user.email,text:t,type:$("#wty").value,status:"open",at:Date.now()})},
  wstat:async(v,e)=>{await updateDoc(D("wishes",e.dataset.id),{status:v,by:S.user.email,upd:Date.now()})},
  redeem:async(_,e)=>{const w=S.wish.find(x=>x.id===e.dataset.id);if(!w||bal(w.owner,w.type)<GOAL||!confirm("用 "+GOAL+" 點兌換這個願望?"))return;
    await addDoc(P("points"),{to:w.owner,kind:w.type,delta:-GOAL,note:"兌換:"+w.text,by:S.user.email,at:Date.now()});await updateDoc(D("wishes",w.id),{status:"done",upd:Date.now()})},
  cm:v=>{S.cm+=+v;if(S.cm<0){S.cm=11;S.cy--}if(S.cm>11){S.cm=0;S.cy++}S.sel=null;draw()},pick:v=>{S.sel=v;draw()},
  am:v=>{S.am+=+v;if(S.am<0){S.am=11;S.ay--}if(S.am>11){S.am=0;S.ay++}draw()},
  wp:v=>{S.wp=v;draw()},wy:v=>{S.wy+=+v;draw()},
  adde:async()=>{const t=$("#et").value.trim();if(t)await addDoc(P("events"),{date:S.sel,title:t})},
  addt:async()=>{const t=$("#tt").value.trim();if(t)await addDoc(P("todos"),{text:t,due:$("#tdd").value,done:false,by:S.user.email,at:Date.now()})},
  delc:async(_,e)=>{if(confirm("刪除這筆?"))await deleteDoc(D(e.dataset.c,e.dataset.id))},
  login:()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>{S.msg=e.message;draw()}),
  out:()=>signOut(auth),tab:v=>{S.tab=v;draw()},yr:v=>{S.year+=+v;draw()},
  add:async()=>{const v=calc($("#qa").value),it=$("#qi").value.trim(),d=dk($("#qd").value);if(!(v>0)||!it)return $("#qe").textContent="請填項目與正確金額";if(!d)return $("#qe").textContent="日期格式請用 2026/10/25 或 10/25";
    const t=S.qt,c=$("#qc").value,b={date:d.replace(/-/g,"/"),item:it,amount:v};
    if(t==="i")await addDoc(P("incomes"),{...b,cat:c});else if(t==="s")await addDoc(P("savings"),{...b,acct:c});else await addDoc(P("expenses"),{...b,cat:c,pay:$("#qp").value});},
  amt:async(_,e)=>{const v=calc(prompt("新金額(可算式)")||"");if(v>0)await updateDoc(D(e.dataset.c,e.dataset.id),{amount:v})},
  savew:async()=>{const me=S.wp||S.user.email;await setDoc(D("work",me),{rate:+$("#wr").value||0,mode:$("#wm").value,medicare:$("#wc").checked,flat:+$("#wf").value||0})},
  addw:async()=>{const me=S.wp||S.user.email,w=S.wkl.find(d=>d.id===me)||{};if(!(w.rate>0))return $("#we2").textContent="請先在上方設定時薪並按儲存";
    const h=hrs($("#ws").value,$("#we").value,$("#wb").value);if(!$("#wd").value||!(h>0))return $("#we2").textContent="請填日期與正確的上下班時間";
    await addDoc(P("shifts"),{date:$("#wd").value,start:$("#ws").value,end:$("#we").value,brk:+$("#wb").value||0,hours:h,mult:+$("#wx").value,rate:w.rate,by:me,at:Date.now()})},
  payinc:async(v,e)=>{const item="薪資("+NM(S.wp||S.user.email)+" "+v+")";if(S.inc.some(x=>x.item===item)&&!confirm("這個月已經記過了,要再記一次嗎?"))return;
    const [y,m]=v.split("-"),last=new Date(+y,+m,0).getDate();await addDoc(P("incomes"),{date:y+"/"+m+"/"+pad(last),cat:S.icats.includes("薪資")?"薪資":S.icats[0],item,amount:+e.dataset.amt})},
  fixed:async()=>{S.weekly=+$("#fx").value||0;await saveSet();draw()},
  addc:async(_,e)=>{const k=e.dataset.k,c=$("#"+e.dataset.i).value.trim();if(c&&!S[k].includes(c)){S[k].push(c);await saveSet()}draw()},
  rmc:async(v,e)=>{const k=e.dataset.k;if(S[k].length>1){S[k]=S[k].filter(c=>c!==v);if(k==="accts")delete S.link[v];await saveSet()}draw()},
  addm:async()=>{const m=$("#me").value.trim().toLowerCase();if(!m)return;await setDoc(doc(db,"members",m),{role:$("#mr").value});await loadMembers();draw()},
  rm:async(_,e)=>{if(confirm("移除這位成員的權限?")){await deleteDoc(doc(db,"members",e.dataset.id));await loadMembers();draw()}}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&t.tagName!=="SELECT"&&t.tagName!=="INPUT"&&act_[t.dataset.a])act_[t.dataset.a](t.dataset.v,t)});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const i=e.target.id;if(i==="qa"){e.target.value=calc(e.target.value)||e.target.value;act_.add()}if(i==="et")act_.adde();if(i==="tt")act_.addt();if(i==="nt")act_.addn()});
document.addEventListener("change",async e=>{const t=e.target,a=t.dataset.a;
  if(a==="cell"){const y=S.year,m=S.years[y]??=Array.from({length:12},()=>({}));m[+t.dataset.i][t.dataset.k]=calc(t.value)||0;await setDoc(D("years",String(y)),{m});draw()}
  if(a==="role"){await setDoc(doc(db,"members",t.dataset.id),{role:t.value});await loadMembers()}
  if(a==="qt"){S.qt=t.value;draw()}
  if(a==="lnk"){if(t.value)S.link[t.dataset.id]=t.value;else delete S.link[t.dataset.id];S.link[SA]=SP;await saveSet();draw()}
  if(a==="photo"){for(const f of t.files){try{const d=await shrink(f);await addDoc(P("photos"),{data:d,cap:"",by:S.user.email,at:Date.now()})}catch(x){alert("這張照片無法上傳:"+x.message)}}t.value=""}
  if(a==="tog")await updateDoc(D("todos",t.dataset.id),{done:t.checked});
});
