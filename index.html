  savew:async()=>{const me=S.wp||S.user.email;await setDoc(D("work",me),{mode:$("#wm").value,medicare:$("#wc").checked,flat:+$("#wf").value||0},{merge:true})},
  jobedit:v=>{S.je=v;draw()},jobcancel:()=>{S.je=null;draw()},
  jobpreset:()=>{$("#jsat").value=1.25;$("#jsun").value=1.5;$("#jhol").value=2.25;$("#jw").value="38:1.5, 40:2"},
  jobsave:async()=>{const me=S.wp||S.user.email,num=i=>+$(i).value||0,d={owner:me,name:$("#jn").value.trim(),type:$("#jt").value,rate:num("#jr"),minh:num("#jmh"),sat:num("#jsat")||1,sun:num("#jsun")||1,hol:num("#jhol")||1,ot:parseOT($("#jo").value),wot:parseOT($("#jw").value),units:parseUnits($("#ju").value),guar:$("#jg").checked,notax:$("#jx").checked};
    if(!d.name)return $("#je2").textContent="請填工作名稱";if(!(d.rate>0)&&!d.units.length)return $("#je2").textContent="請至少填基本時薪或一種計件單價";
    if(S.je)await updateDoc(D("jobs",S.je),d);else await addDoc(P("jobs"),{...d,at:Date.now()});S.je=null;draw()},
  addw:async()=>{const me=S.wp||S.user.email,mj=S.jobs.filter(j=>j.owner===me).sort((a,b)=>(a.at||0)-(b.at||0)),J=mj.find(j=>j.id===S.wj)||mj[0],err=t=>$("#we2").textContent=t;if(!J)return err("請先新增一份工作");const date=$("#wd").value;if(!date)return err("請填日期");const load=J.type==="casual"?LOAD:0;
    if(wmodeOf(J)==="p"){const u=(J.units||[]).find(x=>x.name===$("#wu")?.value),q=+$("#wq").value;if(!u||!(q>0))return err("請選單位並填數量");await addDoc(P("shifts"),{v:2,kind:"piece",job:J.id,jobName:J.name,date,unit:u.name,qty:q,price:u.price,hours:+$("#wph").value||0,guar:J.guar!==false,grate:(J.rate>0?J.rate:MINW)*(1+load),notax:!!J.notax,by:me,at:Date.now()})}
    else{if(!(J.rate>0))return err("這份工作沒有設定基本時薪,請切換到計件或先編輯工作");const h=hrs($("#ws").value,$("#we").value,$("#wb").value);if(!(h>0))return err("請填正確的上下班時間");const dow=new Date(date+"T00:00:00").getDay(),day=$("#wh").checked?"hol":dow===6?"sat":dow===0?"sun":"wk",dm=({wk:1,sat:J.sat||1,sun:J.sun||1,hol:J.hol||1})[day];
      await addDoc(P("shifts"),{v:2,kind:"hourly",job:J.id,jobName:J.name,date,start:$("#ws").value,end:$("#we").value,brk:+$("#wb").value||0,hours:h,rate:J.rate,load,dm,day,ot:J.ot||[],wot:J.wot||[],minh:J.minh||0,notax:!!J.notax,by:me,at:Date.now()})}},
  edit:(_,e)=>{if(e.dataset.id){const ent=(({expenses:S.exp,incomes:S.inc,savings:S.sav})[e.dataset.c]||[]).find(x=>x.id===e.dataset.id);S.ed={c:e.dataset.c,id:e.dataset.id};if(ent)S.qk=ent.prop==="ibis"?"ibis":"home"}else S.ed=null;draw()},clrf:()=>{S.fw=S.fc=S.fp=S.fq=S.fk="";draw()},
  add:async()=>{const v=calc($("#qa").value),it=$("#qi").value.trim(),d=dk($("#qd").value);if(!(v>0)||!it)return $("#qe").textContent="請填項目與正確金額";if(!d)return $("#qe").textContent="日期格式請用 2026/10/25 或 10/25";
    const t=S.ed?S.ed.c:({i:"incomes",s:"savings",x:"expenses"})[S.qt],c=$("#qc").value,b={date:d.replace(/-/g,"/"),item:it,amount:v,by:$("#qw").value,note:$("#qn").value.trim()};
    if($("#qs"))b.store=$("#qs").value.trim();if(t!=="savings"){const ib=$("#qk")&&$("#qk").value==="ibis";b.prop=ib?"ibis":"";b.tenant=ib&&t==="incomes"&&$("#qtn")?$("#qtn").value:""}if(t==="savings")b.acct=c;else b.cat=c;if(t==="expenses")b.pay=$("#qp").value;
    if(S.ed){await updateDoc(D(S.ed.c,S.ed.id),b);S.ed=null;draw()}else await addDoc(P(t),b);},
  payinc:async(v,e)=>{const item="薪資("+NM(S.wp||S.user.email)+" "+v+")";if(S.inc.some(x=>x.item===item)&&!confirm("這個月已經記過了,要再記一次嗎?"))return;
    const [y,m]=v.split("-"),last=new Date(+y,+m,0).getDate();await addDoc(P("incomes"),{date:y+"/"+m+"/"+pad(last),cat:S.icats.includes("薪資")?"薪資":S.icats[0],item,amount:+e.dataset.amt})},
  fixed:async()=>{S.weekly=+$("#fx").value||0;await saveSet();draw()},
  addc:async(_,e)=>{const k=e.dataset.k,c=$("#"+e.dataset.i).value.trim();if(c&&!S[k].includes(c)){S[k].push(c);await saveSet()}draw()},
  rmc:async(v,e)=>{const k=e.dataset.k;if(S[k].length>1){S[k]=S[k].filter(c=>c!==v);if(k==="accts")delete S.link[v];await saveSet()}draw()},
  addm:async()=>{const m=$("#me").value.trim().toLowerCase();if(!m)return;await setDoc(doc(db,"members",m),{role:$("#mr").value});await loadMembers();draw()},
  rm:async(_,e)=>{if(confirm("移除這位成員的權限?")){await deleteDoc(doc(db,"members",e.dataset.id));await loadMembers();draw()}}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&t.tagName!=="SELECT"&&t.tagName!=="INPUT"&&act_[t.dataset.a])act_[t.dataset.a](t.dataset.v,t)});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const i=e.target.id;if(i==="qa"){e.target.value=calc(e.target.value)||e.target.value;act_.add()}if(i==="et")act_.adde();if(i==="tt")act_.addt();if(i==="nt")act_.addn()});
document.addEventListener("change",async e=>{const t=e.target,a=t.dataset.a;
  if(a==="cell"){const y=S.year,m=S.years[y]??=Array.from({length:12},()=>({}));m[+t.dataset.i][t.dataset.k]=calc(t.value)||0;await setDoc(D("years",String(y)),{m});draw()}
  if(a==="role"){await setDoc(doc(db,"members",t.dataset.id),{role:t.value});await loadMembers()}
  if(a==="qt"){S.qt=t.value;draw()}
  if(a==="qk"){S.qk=t.value;draw()}
  if(a==="pfwho"){S.pfw=t.value;draw()}
  if(a==="flt"){S[t.dataset.k]=t.value;draw()}
  if(a==="wj"){S.wj=t.value;const j=S.jobs.find(x=>x.id===t.value);if(j)S.wmode=j.rate>0?"h":"p";draw()}
  if(a==="wmode"){S.wmode=t.value;draw()}
  if(a==="lnk"){if(t.value)S.link[t.dataset.id]=t.value;else delete S.link[t.dataset.id];S.link[SA]=SP;await saveSet();draw()}
  if(a==="photo"){for(const f of t.files){try{const d=await shrink(f);await addDoc(P("photos"),{data:d,cap:"",by:S.user.email,at:Date.now()})}catch(x){alert("這張照片無法上傳:"+x.message)}}t.value=""}
  if(a==="tog")await updateDoc(D("todos",t.dataset.id),{done:t.checked});
});
