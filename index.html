<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>家計簿</title>
<style>
:root{--bg:#f4f1ea;--hd:#1f3d2e;--gr:#2d6a4f;--gold:#c98a2b;--ink:#2b2b28;--mut:#77756c;--line:#e4dfd2;--rose:#f9e3e6;--mint:#e3f0e8;--sand:#faf1e0;--sky:#e6eff8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{background:var(--hd);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 24px;flex-wrap:wrap}
.logo{background:var(--gold);border-radius:8px;padding:2px 8px;font-weight:700;margin-right:6px}
.brand{font-weight:700;margin-right:14px}
nav button{background:none;border:0;color:#d5e2da;padding:7px 14px;border-radius:99px;font:inherit;cursor:pointer}
nav button.on{background:#fff;color:var(--hd);font-weight:700}
.sp{flex:1}.tag{background:var(--gold);color:#fff;font-size:12px;padding:1px 9px;border-radius:99px}
.gh{background:none;border:1px solid #5b7a69;color:#fff;border-radius:99px;padding:5px 12px;font:inherit;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:20px 24px 60px}
h1{margin:6px 0 14px;font-size:28px}h3{margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.k{border-width:2px}.k1{background:#fdf6f7;border-color:#ecc3ca}.k2{background:#f3faf6;border-color:#bcd8c7}.k3{background:var(--rose);border-color:#dfa0ac}.k4{background:var(--mint);border-color:#9bc4ac}
.k b{display:block;font-size:24px;margin-top:6px}.k small{color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;min-width:0}
.btn{background:var(--gold);color:#fff;border:0;border-radius:99px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:var(--gr)}.btn.o{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:400}
.sm{padding:4px 12px;font-size:13px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td:first-child,th:first-child{text-align:left;font-weight:700}
td input{width:96px;text-align:right;border-color:transparent;background:transparent}td input:focus{border-color:var(--gr);background:#fff}
.t-sp{background:var(--sand)}.t-in{background:var(--sky)}.t-su{background:var(--rose)}.t-re{background:var(--mint)}
.quick{border:2px solid var(--gold);border-radius:14px;padding:12px 14px;background:#fff;margin-bottom:18px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;cursor:pointer;font:inherit}.pill.on{background:var(--gr);color:#fff;border-color:var(--gr)}
.item{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;flex-wrap:wrap}
.item .n{flex:1;min-width:140px}.item .a{font-weight:700;font-size:18px}.m{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:9px;margin:3px 0 10px}.bar i{display:block;height:100%;background:var(--gr);border-radius:9px}
.x{cursor:pointer;color:#b0463c;background:none;border:0;font-size:16px}
.login{max-width:380px;margin:18vh auto;text-align:center}.err{color:#b0463c}
.ys{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.ys div.l{display:flex;justify-content:space-between;padding:3px 0}
</style></head><body><div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,collection,getDocs,onSnapshot,addDoc,updateDoc,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyC2ud4hkmXQK7n_Hm7in-1kZTZBRT6kpxI",authDomain:"tkinaus.firebaseapp.com",projectId:"tkinaus",storageBucket:"tkinaus.firebasestorage.app",messagingSenderId:"816682262603",appId:"1:816682262603:web:d0522e30fcad3aafec6dce"};
const ADMIN_EMAILS=["s13114153@gmail.com"];
const DEF=["學費","居家","尿布、奶粉","醫療","保險","伙食","娛樂","其他"];

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const S={cats:[...DEF],user:null,role:null,lid:null,tab:"in",year:new Date().getFullYear(),years:{},fixed:0,exp:[],members:[],sub:"unpaid",all:false,msg:""};
const $=s=>document.querySelector(s),n=x=>Math.round(+x||0).toLocaleString();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=(...a)=>collection(db,"ledgers",S.lid,...a), D=(...a)=>doc(db,"ledgers",S.lid,...a);
let unsub=null;

onAuthStateChanged(auth,async u=>{
  S.user=u;S.role=null;if(unsub)unsub();
  if(!u)return draw();
  try{
    let m=await getDoc(doc(db,"members",u.email));
    if(!m.exists()&&ADMIN_EMAILS.includes(u.email)){await setDoc(doc(db,"members",u.email),{role:"admin"});m=await getDoc(doc(db,"members",u.email));}
    if(!m.exists()){S.msg="這個 Google 帳號尚未被授權,請聯絡管理者。";return draw();}
    S.role=m.data().role;S.lid="main";
    if(S.role==="admin")await loadMembers();
    await openLedger();
  }catch(e){S.msg="讀取失敗:"+e.message;draw();}
});
async function loadMembers(){S.members=(await getDocs(collection(db,"members"))).docs.map(d=>({email:d.id,role:d.data().role}));}
async function openLedger(){
  if(unsub)unsub();
  S.years={};(await getDocs(P("years"))).forEach(d=>S.years[d.id]=d.data().m);
  const f=await getDoc(D("meta","settings"));S.fixed=f.exists()?f.data().fixed||0:0;S.cats=f.exists()&&f.data().cats?.length?f.data().cats:[...DEF];
  unsub=onSnapshot(P("expenses"),s=>{S.exp=s.docs.map(d=>({id:d.id,...d.data()}));draw();});
  draw();
}
const g=(y,i,k)=>+(S.years[y]?.[i]?.[k])||0;
const tot=(y,i)=>S.fixed+g(y,i,"extra"), act=(y,i)=>g(y,i,"salary")+g(y,i,"stock")+g(y,i,"other");
const sum=(y,f)=>[...Array(12).keys()].reduce((a,i)=>a+f(y,i),0);
const calc=s=>{s=String(s).trim().replace(/^=/,"");if(!/^[\d+\-*/().\s]+$/.test(s))return NaN;try{return Math.round(Function('"use strict";return('+s+')')())}catch{return NaN}};

function draw(){
  const a=$("#app");
  if(!S.user)return a.innerHTML=`<div class="login card"><h1>家計簿</h1><p class="m">用 Google 帳號登入,只有被授權的人可以進入。</p><button class="btn" data-a="login">使用 Google 登入</button><p class="err">${esc(S.msg)}</p></div>`;
  if(!S.role)return a.innerHTML=`<div class="login card"><h3>無法進入</h3><p class="err">${esc(S.msg)}</p><button class="btn o" data-a="out">登出</button></div>`;
  const adm=S.role==="admin",T=[["in","收入／存錢"],["st","歷年統計"],["ap","申請表"],...(adm?[["se","設定"]]:[])];
  a.innerHTML=`<header><span class="logo">家</span><span class="brand">家計簿</span><nav>${T.map(t=>`<button class="${S.tab===t[0]?"on":""}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join("")}</nav><span class="sp"></span><span class="m" style="color:#cfe0d6">${esc(S.user.email)}</span><span class="tag">${adm?"管理者":"成員"}</span><button class="gh" data-a="out">登出</button></header><main>
  ${S.tab==="in"?vIn():S.tab==="st"?vSt():S.tab==="ap"?vAp():vSe()}</main>`;
}
function vIn(){
  const y=S.year,ex=sum(y,(y,i)=>g(y,i,"exp")),ac=sum(y,act),ts=sum(y,tot),es=ex-ts,as=ac-ts;
  const inp=(i,k)=>`<td><input data-a="cell" data-i="${i}" data-k="${k}" inputmode="numeric" value="${g(y,i,k)||""}"></td>`;
  return `<h1>收入／存錢</h1><div class="row" style="margin-bottom:14px"><button class="pill" data-a="yr" data-v="-1">‹</button><b>${y}</b><button class="pill" data-a="yr" data-v="1">›</button></div>
  <div class="cards"><div class="card k k1"><small>${y} 預期入帳</small><b>${n(ex)}</b></div><div class="card k k2"><small>預期存款</small><b>${n(es)}</b><small>每月固定支出 ${n(S.fixed)}</small></div><div class="card k k3"><small>實際入帳</small><b>${n(ac)}</b></div><div class="card k k4"><small>實際存款</small><b>${n(as)}</b></div></div>
  <div class="card"><h3>${y} 每月詳細</h3><div class="wrap"><table><tr><th>月份</th><th class="t-sp">額外開銷</th><th class="t-sp">總開銷</th><th>預期入帳</th><th>預期存款</th><th class="t-in">薪資</th><th class="t-in">股票</th><th class="t-in">其他</th><th class="t-su">實際入帳</th><th class="t-re">實際存款</th></tr>
  ${[...Array(12).keys()].map(i=>`<tr><td>${i+1}月</td>${inp(i,"extra")}<td>${n(tot(y,i))}</td>${inp(i,"exp")}<td>${n(g(y,i,"exp")-tot(y,i))}</td>${inp(i,"salary")}${inp(i,"stock")}${inp(i,"other")}<td>${n(act(y,i))}</td><td>${n(act(y,i)-tot(y,i))}</td></tr>`).join("")}</table></div><p class="m">點數字直接修改,離開欄位即自動儲存。</p></div>`;
}
function vSt(){
  const ys=[...new Set([...Object.keys(S.years).map(Number),new Date().getFullYear()])].sort((a,b)=>b-a);
  return `<h1>歷年統計</h1><div class="ys">${ys.map(y=>{const ex=sum(y,(y,i)=>g(y,i,"exp")),ac=sum(y,act),ts=sum(y,tot),L=(a,b)=>`<div class="l"><span>${a}</span><b>${b}</b></div>`;
  return `<div class="card ${y===new Date().getFullYear()?"k":""}"><h3>${y}</h3>${L("預期入帳",n(ex))}${L("實際入帳",n(ac))}${L("　薪資",n(sum(y,(y,i)=>g(y,i,"salary"))))}${L("　股票",n(sum(y,(y,i)=>g(y,i,"stock"))))}${L("　其他",n(sum(y,(y,i)=>g(y,i,"other"))))}${L("預期存款",n(ex-ts))}${L("實際存款",n(ac-ts))}${L("落差(實際−預期)",n(ac-ex))}${L("存款比例",`預期 ${ex?Math.round((ex-ts)/ex*100):0}% / 實際 ${ac?Math.round((ac-ts)/ac*100):0}%`)}</div>`}).join("")}</div>`;
}
function vAp(){
  const un=S.exp.filter(e=>!e.paid),pd=S.exp.filter(e=>e.paid),total=S.exp.reduce((a,e)=>a+e.amount,0);
  const bs={};pd.forEach(e=>{(bs[e.batch]??={d:e.paidDate,p:e.pay,t:0,c:0,k:e.batch});bs[e.batch].t+=e.amount;bs[e.batch].c++});
  const B=Object.values(bs).sort((a,b)=>b.d>a.d?1:-1),shown=S.all?B:B.slice(0,8);
  const cs={};S.exp.forEach(e=>cs[e.cat]=(cs[e.cat]||0)+e.amount);
  const today=new Date().toISOString().slice(0,10).replace(/-/g,"/");
  const list=p=>{const r=un.filter(e=>e.pay===p).sort((a,b)=>b.date>a.date?1:-1);return `<h3>${p==="card"?"信用卡":"現金"} <span class="m">${r.length} 筆・${n(r.reduce((a,e)=>a+e.amount,0))}</span> ${r.length?`<button class="btn g sm" data-a="pay" data-v="${p}">給付</button>`:""}</h3>${r.map(e=>`<div class="item"><span class="m">${esc(e.date)}・${esc(e.cat)}</span><span class="n">${esc(e.item)}</span><span class="a" data-a="amt" data-id="${e.id}" style="cursor:pointer">${n(e.amount)}</span><button class="x" data-a="del" data-id="${e.id}">✕</button></div>`).join("")||'<p class="m">沒有項目</p>'}`};
  return `<h1>申請表 <small class="m">累計 <b style="color:var(--gr)">${n(total)}</b></small></h1>
  <div class="quick"><div class="row"><b style="color:var(--gold)">快速記一筆</b><input id="qd" value="${today}" size="10"><select id="qc">${S.cats.map(c=>`<option>${c}</option>`).join("")}</select><select id="qp"><option value="card">信用卡</option><option value="cash">現金</option></select><input id="qi" placeholder="項目" style="flex:1;min-width:120px"><input id="qa" placeholder="金額,可算式" size="12"><button class="btn" data-a="add">記下</button></div><div class="m">金額可直接打算式:=200/2 按 Enter 自動變 100。</div><div class="err" id="qe"></div></div>
  <div class="grid"><div class="card"><div class="row" style="margin-bottom:8px"><button class="pill ${S.sub==="unpaid"?"on":""}" data-a="sub" data-v="unpaid">未給付 ${n(un.reduce((a,e)=>a+e.amount,0))}</button><button class="pill ${S.sub==="paid"?"on":""}" data-a="sub" data-v="paid">已給付(${B.length} 批)</button></div>
  ${S.sub==="unpaid"?list("card")+list("cash"):shown.map(b=>`<div class="item"><span class="tag" style="background:var(--gr)">已給付・${b.p==="card"?"轉帳":"現金"}</span><span class="n m">${esc(b.d)}</span><span class="a">${n(b.t)}</span><span class="m">${b.c} 筆</span></div>`).join("")+(B.length>8&&!S.all?'<button class="pill" data-a="all">顯示全部</button>':"")}</div>
  <div class="card"><h3>分類統計</h3>${S.cats.concat(Object.keys(cs).filter(c=>!S.cats.includes(c))).filter(c=>cs[c]).sort((a,b)=>cs[b]-cs[a]).map(c=>`<div class="row" style="justify-content:space-between"><b>${esc(c)}</b><span class="m">${n(cs[c])}・${(cs[c]/total*100).toFixed(1)}%</span></div><div class="bar"><i style="width:${cs[c]/total*100}%"></i></div>`).join("")||'<p class="m">還沒有資料</p>'}<div class="row" style="justify-content:space-between"><b>總計</b><b style="color:var(--gr)">${n(total)}</b></div></div></div>`;
}
function vSe(){
  return `<h1>設定</h1><div class="card" style="margin-bottom:14px"><h3>每月固定支出(兩人共用)</h3><div class="row"><input id="fx" inputmode="numeric" value="${S.fixed}"><button class="btn g sm" data-a="fixed">儲存</button></div></div>
  <div class="card" style="margin-bottom:14px"><h3>分類</h3><div class="row">${S.cats.map(c=>`<span class="pill">${esc(c)} <button class="x" data-a="rmc" data-v="${esc(c)}">✕</button></span>`).join("")}</div><div class="row" style="margin-top:10px"><input id="nc" placeholder="新分類名稱"><button class="btn sm" data-a="addc">新增</button></div><p class="m">移除分類不會刪掉舊紀錄,舊紀錄仍會出現在統計裡。</p></div>
  <div class="card"><h3>使用權限</h3><p class="m">管理者:可管理成員與設定。成員:和管理者一起查看、記錄同一本共同帳本。</p>${S.members.map(m=>`<div class="item"><span class="n">${esc(m.email)}</span><select data-a="role" data-id="${esc(m.email)}"><option value="admin" ${m.role==="admin"?"selected":""}>管理者</option><option value="member" ${m.role==="member"?"selected":""}>成員</option></select>${m.email!==S.user.email?`<button class="x" data-a="rm" data-id="${esc(m.email)}">✕</button>`:""}</div>`).join("")}
  <div class="row" style="margin-top:10px"><input id="me" type="email" placeholder="對方的 Gmail" style="flex:1"><select id="mr"><option value="member">成員</option><option value="admin">管理者</option></select><button class="btn sm" data-a="addm">新增</button></div></div>`;
}
const saveSet=()=>setDoc(D("meta","settings"),{fixed:S.fixed,cats:S.cats});
const act_={
  login:()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>{S.msg=e.message;draw()}),
  out:()=>signOut(auth),tab:v=>{S.tab=v;draw()},yr:v=>{S.year+=+v;draw()},sub:v=>{S.sub=v;draw()},all:()=>{S.all=true;draw()},
  add:async()=>{const v=calc($("#qa").value),it=$("#qi").value.trim();if(!(v>0)||!it)return $("#qe").textContent="請填項目與正確金額";
    await addDoc(P("expenses"),{date:$("#qd").value,cat:$("#qc").value,pay:$("#qp").value,item:it,amount:v,paid:false});},
  del:async(_,e)=>{if(confirm("刪除這筆?"))await deleteDoc(D("expenses",e.dataset.id))},
  amt:async(_,e)=>{const v=calc(prompt("新金額(可算式)")||"");if(v>0)await updateDoc(D("expenses",e.dataset.id),{amount:v})},
  pay:async v=>{const b=writeBatch(db),id="b"+Date.now(),d=new Date().toISOString().slice(0,10).replace(/-/g,"/");
    S.exp.filter(e=>!e.paid&&e.pay===v).forEach(e=>b.update(D("expenses",e.id),{paid:true,batch:id,paidDate:d}));await b.commit();},
  fixed:async()=>{S.fixed=+$("#fx").value||0;await saveSet();draw()},
  addc:async()=>{const c=$("#nc").value.trim();if(c&&!S.cats.includes(c)){S.cats.push(c);await saveSet()}draw()},
  rmc:async v=>{if(S.cats.length>1){S.cats=S.cats.filter(c=>c!==v);await saveSet()}draw()},
  addm:async()=>{const m=$("#me").value.trim().toLowerCase();if(!m)return;await setDoc(doc(db,"members",m),{role:$("#mr").value});await loadMembers();draw()},
  rm:async(_,e)=>{if(confirm("移除這位成員的權限?")){await deleteDoc(doc(db,"members",e.dataset.id));await loadMembers();draw()}}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&t.tagName!=="SELECT"&&t.tagName!=="INPUT"&&act_[t.dataset.a])act_[t.dataset.a](t.dataset.v,t)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="qa"){e.target.value=calc(e.target.value)||e.target.value;act_.add()}});
document.addEventListener("change",async e=>{const t=e.target,a=t.dataset.a;
  if(a==="cell"){const y=S.year,m=S.years[y]??=Array.from({length:12},()=>({}));m[+t.dataset.i][t.dataset.k]=calc(t.value)||0;await setDoc(D("years",String(y)),{m});draw()}
  if(a==="role"){await setDoc(doc(db,"members",t.dataset.id),{role:t.value});await loadMembers()}
});
</script></body></html>
